[manifest]
id = "nikamimi_dk64_ra_probe"
version = "0.2.2"
display_name = "DK64 RetroAchievements"
description = "Recommended to play with Vanilla DK Rekongpiled. Compatibility with other mods is not guaranteed, but feel free to try.\n\nRetroAchievements account required for online awards. If no account is available, local progress only after this PC has cached the DK64 set. Create an account at https://retroachievements.org. F8 or R + D-pad Up opens the badge grid; hover a badge or browse with arrow keys, D-pad or left stick; F8, Esc, or controller B closes it. Toasts show badges, titles and descriptions with an optional jingle. Reset local history with confirmation."
short_description = "RetroAchievements for DK64: badge browser, online awards and local tracking."
authors = ["Nikamimi"]
game_id = "dk64"
minimum_recomp_version = "1.0.0"
native_libraries = [
    { name = "dk64_ra_probe", funcs = ["dk64_ra_probe_init", "dk64_ra_probe_frame", "dk64_ra_ui_revision", "dk64_ra_ui_count", "dk64_ra_ui_entry", "dk64_ra_ui_badge", "dk64_ra_ui_summary", "dk64_ra_ui_take_toast", "dk64_ra_ui_toast_description", "dk64_ra_ui_toast_badge", "dk64_ra_ui_hotkey", "dk64_ra_ui_reset_local", "dk64_ra_ui_input", "dk64_ra_ui_account", "dk64_ra_ui_account_action"] },
]

[inputs]
elf_path = "build/mod.elf"
mod_filename = "dk64_ra_probe"
func_reference_syms_file = "reference/dk64/DK64Syms/dump.toml"
data_reference_syms_files = ["reference/dk64/DK64Syms/data_dump.toml"]
additional_files = ["thumb.png"]

[[manifest.config_options]]
id = "tracking_mode_v2"
name = "Achievement mode"
description = "Online submits achievements to RA; without sign-in it falls back to Local Tracking only when a DK64 set is cached on this PC. Local mode never requires sign-in when cached. The current RA username appears in the F8 browser after sign-in. No Hardcore or leaderboards. Restart after changing."
type = "Enum"
options = ["Online", "Local Tracking only"]
default = "Online"

[[manifest.config_options]]
id = "notification_sound"
name = "Achievement jingle"
description = "Play a short original tropical percussion and marimba jingle when an achievement toast appears. No DK64 audio is bundled."
type = "Enum"
options = ["On", "Off"]
default = "On"

[[manifest.config_options]]
id = "ra_account_help"
name = "RA account"
description = "Open F8 > Account during gameplay to view your signed-in username, sign in, or log out. Choose whether to remember sign-in in the Windows login window."
type = "Enum"
options = ["Manage in F8 > Account"]
default = "Manage in F8 > Account"
